# ==========================================================
# Redis configuration
# ==========================================================
bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 60

daemonize no
loglevel notice
databases 16

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
dir /data

# Memory: defaults only. The image passes --maxmemory / --maxmemory-policy from REDIS_MAXMEMORY and
# REDIS_MAXMEMORY_POLICY (NC-3919), which override these lines.
maxmemory 1536mb
maxmemory-policy allkeys-lru