# ==========================================================
# Redis configuration
# ==========================================================
bind 0.0.0.0
protected-mode no
port 6379
tcp-keepalive 60

daemonize no
loglevel notice
databases 16

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
dir /data

# Memory: defaults only. The image passes --maxmemory / --maxmemory-policy from REDIS_MAXMEMORY and
# REDIS_MAXMEMORY_POLICY (NC-3919), which override these lines.
maxmemory 1536mb
# NC-3920: noeviction. A full Redis refuses writes (visible errors) instead of silently evicting sessions, the shared
# RBAC map, the JWT denylist (a logged-out token would work again) or scheduler locks; every cache entry has a TTL.
# Alert when used_memory passes ~80% of maxmemory (redis_exporter: redis_memory_used_bytes / redis_memory_max_bytes).
maxmemory-policy noeviction
